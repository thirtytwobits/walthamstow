name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.99.0
      - run: cargo xtask check
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.99.0
      - run: cargo xtask check
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: cargo xtask api
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --locked --workspace --exclude xtask
  release-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/release.py check
