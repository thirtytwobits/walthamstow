name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - name: Check that the tag names the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Write the release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release-notes "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
