[workspace]
members = [
  "crates/walthamstow-kernel",
  "crates/walthamstow-logs",
  "crates/walthamstow-workspace",
  "crates/walthamstow-upgrades",
  "crates/walthamstow-ops",
  "examples/ops",
  "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/thirtytwobits/walthamstow"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = { version = "0.4.42", features = ["serde"] }
# The tag Clerkenwell takes, so one application composes both pieces' operations.
clapham = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3", version = "0.3.3" }
clapham-cli = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3", version = "0.3.3" }
clapham-conformance = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3", version = "0.3.3" }
clapham-mcp-server = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3", version = "0.3.3" }
clerkenwell-doc = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
clerkenwell-events = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
clerkenwell-ops = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
clerkenwell-schema = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
clerkenwell-session = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
clerkenwell-store = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.12.0" }
jsonschema = "0.60.2"
percent-encoding = "2.3.2"
rand = { version = "0.9.2", features = ["small_rng"] }
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = "0.7.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
winx = "0.36.4"

# Clerkenwell's crates build on a Loro fork, and workspace patches do not propagate to
# dependents: every workspace that builds Clerkenwell carries Clerkenwell's override, at the
# Loro revision its release names.
[patch.crates-io]
generic-btree = { git = "https://github.com/thirtytwobits/loro.git", rev = "ef1964a317d743ebd5c0419d35393ff980daa2fe" }
