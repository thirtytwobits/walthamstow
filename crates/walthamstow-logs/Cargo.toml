[package]
name = "walthamstow-logs"
description = "Log documents: a head and an ordered log of records, written by one lease holder at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The conformance suite every adapter of `LogStore` runs.
conformance = ["dep:rand"]

[dependencies]
cap-std.workspace = true
chrono.workspace = true
clerkenwell-events.workspace = true
percent-encoding.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
walthamstow-kernel = { path = "../walthamstow-kernel", version = "0.7.0" }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
