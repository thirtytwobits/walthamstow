[package]
name = "walthamstow-ops-example"
description = "Walthamstow's operations assembled into a daemon and a CLI, as Clapham's conformance harness drives them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ops_example"

[[bin]]
name = "ops-example"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clapham.workspace = true
clapham-cli.workspace = true
clapham-conformance.workspace = true
clapham-mcp-server.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process"] }
walthamstow-kernel = { path = "../../crates/walthamstow-kernel" }
walthamstow-ops = { path = "../../crates/walthamstow-ops" }
